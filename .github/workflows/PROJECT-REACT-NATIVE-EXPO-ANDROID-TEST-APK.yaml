# ===================================================================
# React Native(Expo) Android 테스트 APK: 고른 브랜치를 빌드해 내려받을 파일로 올림
# ===================================================================
# 수동 실행 전용. 스토어에 올리지 않음
#
# 필요한 GitHub Secrets (없으면 디버그 키로 서명한 APK 를 만듦)
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#   ENV_FILE: mobile/.env 내용 (선택)
#   GOOGLE_SERVICES_JSON: Firebase 설정 (푸시를 붙인 뒤 필요)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: 서비스 계정 키(base64). Firebase App Distribution 업로드에도 씀
#     (계정에 Firebase 앱 배포 관리자 역할 필요. 없으면 업로드 단계만 건너뜀)
# ===================================================================

name: PROJECT-REACT-NATIVE-EXPO-ANDROID-TEST-APK
run-name: TEST APK ${{ inputs.branch || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "빌드할 브랜치 (비우면 실행한 브랜치)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# ============================================
# 프로젝트별 설정
# ============================================
env:
  EXPO_PUBLIC_API_BASE_URL: "https://api.secbrief.suhsaechan.kr"   # 앱 번들에 박히는 운영 API 주소 (3개 워크플로 같은 값, mobile/tests/config 가 확인)
  EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}   # Expo 푸시 토큰 발급용 프로젝트 ID (Variable, 없으면 앱이 알림 스위치를 잠금)
  APP_DIRECTORY: "mobile"
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}
  JAVA_VERSION: ${{ vars.JAVA_VERSION || '17' }}
  # Firebase 앱 ID (비밀 아님) / App Distribution 테스터 그룹
  FIREBASE_APP_ID: "1:105680224180:android:c0122c171bb51433c07ce1"
  FIREBASE_TESTER_GROUP: "internal"

jobs:
  build-apk:
    name: APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIRECTORY }}/package-lock.json

      - name: Java 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 의존성 설치
        working-directory: ${{ env.APP_DIRECTORY }}
        run: npm ci

      - name: .env 파일 만들기 (있을 때만)
        working-directory: ${{ env.APP_DIRECTORY }}
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s' "$ENV_FILE" > .env; fi

      - name: Firebase 설정 파일 만들기 (있을 때만)
        working-directory: ${{ env.APP_DIRECTORY }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      - name: 네이티브 Android 프로젝트 생성
        working-directory: ${{ env.APP_DIRECTORY }}
        run: npx expo prebuild --platform android --no-install

      # 서명 키가 있으면 릴리스 키, 없으면 템플릿 기본(디버그 키)으로 서명
      - name: APK 빌드
        working-directory: ${{ env.APP_DIRECTORY }}/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          SIGNING_ARGUMENTS=()
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            SIGNING_ARGUMENTS=(
              "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH"
              "-Pandroid.injected.signing.store.password=$RELEASE_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$RELEASE_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$RELEASE_KEY_PASSWORD"
            )
          fi
          ./gradlew assembleRelease --no-daemon "${SIGNING_ARGUMENTS[@]}"

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-${{ github.run_number }}
          path: ${{ env.APP_DIRECTORY }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      # uses: 액션은 glob 을 못 풀어서 APK 실제 경로를 먼저 찾음
      - name: 업로드할 APK 경로 찾기
        id: apk_path
        run: |
          APK_PATH=$(ls "$GITHUB_WORKSPACE/$APP_DIRECTORY"/android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # 키는 임시 파일로만 두고 로그에 안 찍히게 마스킹, 단계 끝에 삭제
      - name: Firebase 서비스 계정 키 만들기
        id: firebase_credentials
        env:
          SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON_BASE64" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$SERVICE_ACCOUNT_JSON_BASE64"
          CREDENTIALS_PATH="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$CREDENTIALS_PATH"
          chmod 600 "$CREDENTIALS_PATH"
          echo "has_key=true" >> "$GITHUB_OUTPUT"
          echo "path=$CREDENTIALS_PATH" >> "$GITHUB_OUTPUT"

      - name: Firebase App Distribution 에 올리기
        if: steps.firebase_credentials.outputs.has_key == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFile: ${{ steps.firebase_credentials.outputs.path }}
          groups: ${{ env.FIREBASE_TESTER_GROUP }}
          file: ${{ steps.apk_path.outputs.path }}
          releaseNotes: |
            테스트 빌드 #${{ github.run_number }}
            브랜치: ${{ inputs.branch || github.ref_name }}
            커밋: ${{ github.sha }}

      - name: Firebase 서비스 계정 키 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
