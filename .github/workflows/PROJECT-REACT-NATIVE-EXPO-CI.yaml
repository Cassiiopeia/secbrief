# ===================================================================
# React Native(Expo) 앱 CI: 타입 검사 > 린트 > 규칙 테스트
# ===================================================================
# PR 과 main 푸시에서 mobile/ 이 바뀌었을 때만 실행. 비밀값 불필요
# ===================================================================

name: PROJECT-REACT-NATIVE-EXPO-CI

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/PROJECT-REACT-NATIVE-EXPO-CI.yaml"]
  push:
    branches: ["main"]
    paths: ["mobile/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rn-expo-ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================
# 프로젝트별 설정
# ============================================
env:
  APP_DIRECTORY: "mobile"   # Expo 앱 폴더 (레포 루트 기준)
  NODE_VERSION: ${{ vars.NODE_VERSION || '22' }}

jobs:
  verify:
    name: 타입 검사 · 린트 · 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIRECTORY }}
    steps:
      - name: 레포 체크아웃
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_DIRECTORY }}/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 린트
        run: npx eslint .

      - name: 규칙 테스트
        run: npx jest --ci
