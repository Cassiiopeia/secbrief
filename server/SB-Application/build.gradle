plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

bootJar { enabled = false }
jar { enabled = true; archiveClassifier = '' }

dependencies {
    api project(':SB-Common')
    api project(':SB-Domain-Member')
    api project(':SB-Domain-Advisory')

    testImplementation testFixtures(project(':SB-Domain-Advisory'))
}
