plugins {
    id 'java-library'
    // 다른 모듈 테스트가 쓰는 Source 테스트 객체 (SourceFixtures)
    id 'java-test-fixtures'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

bootJar { enabled = false }
jar { enabled = true; archiveClassifier = '' }

dependencies {
    api project(':SB-Common')

    // RSS·Atom 피드 파싱 (인코딩 자동 감지)
    implementation 'com.rometools:rome:2.1.0'
    // KISA 보호나라 게시판 목록 쪽 읽기 (지난 공지 1회 채우기, 인코딩 자동 감지)
    implementation 'org.jsoup:jsoup:1.24.1'

    // AI 제목 분류·번역 (공식 Anthropic Java SDK, 구조화 출력)
    implementation 'com.anthropic:anthropic-java:3.12.0'

    // 기사 대표 이미지 저장소 (MinIO, S3 호환)
    implementation 'io.minio:minio:8.5.17'
    // 이미지 내려받기: 접속 직전 DNS 결과를 검사할 수 있는 HTTP 클라이언트 (MinIO 와 같은 버전)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // WebP 디코드 (ImageIO 플러그인, 실행 시 자동 등록)
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'

    // SourceFixtures 가 ReflectionTestUtils 로 엔티티 필드를 채움
    testFixturesImplementation 'org.springframework:spring-test'
}
