plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    api project(':SB-Common')
    api project(':SB-Domain-Member')
    api project(':SB-Domain-Advisory')
    api project(':SB-Application')

    // 관리자 페이지: 세션 폼 로그인, 서버 렌더링 화면 (버전은 Boot BOM)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation testFixtures(project(':SB-Domain-Advisory'))
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
    // 비밀 설정 jar 제외 (이미지 유출 방지): 운영은 호스트 config/ 를 /app/config 로 마운트해 읽음
    exclude 'application-prod.yml', 'application-dev.yml'
}

// 공유 미리보기 페이지 자산: 레포 원본에서 빌드 때 복사 (사본을 커밋하지 않음)
// 브랜드 색 brand/brand-colors.json > classpath share/, 앱 아이콘 mobile/assets/images/icon.png > static/share/app-icon.png
def repositoryRoot = rootProject.projectDir.parentFile
tasks.named('processResources') {
    from(new File(repositoryRoot, 'brand/brand-colors.json')) {
        into 'share'
    }
    from(new File(repositoryRoot, 'mobile/assets/images/icon.png')) {
        into 'static/share'
        rename { 'app-icon.png' }
    }
}
