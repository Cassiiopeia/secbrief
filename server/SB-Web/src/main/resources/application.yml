# 공통 설정: 비밀값은 환경변수로만 받음 (실제 값은 커밋 금지)
spring:
  application:
    name: secbrief
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/secbrief}
    username: ${DATABASE_USERNAME:secbrief}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway 만 수행, JPA 는 일치 여부만 확인
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 파일명: V{version.yml 버전}__설명.sql
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
