<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('AI 호출', 'ai-calls', ~{::content})}">
<body>

<main th:fragment="content" class="flex-1 space-y-6 p-4 lg:p-6">
  <div th:replace="~{admin/fragments/admin-ui :: pageHeader('AI 호출',
       'AI 제공자를 부를 때마다 1줄씩 남아요. 키를 넘겨 가며 다시 부른 호출도 따로 보여 줘요. 비용은 설정한 단가로 추정한 값이에요.')}"></div>

  <!--/* 합계 카드: 서울 날짜 기준 */-->
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    <div th:replace="~{admin/fragments/admin-ui :: statCard('오늘 호출',
         ${#numbers.formatInteger(todaySummary.totalCallCount(), 1, 'COMMA')},
         |성공 ${#numbers.formatInteger(todaySummary.totalSuccessCount(), 1, 'COMMA')} · 실패 ${#numbers.formatInteger(todaySummary.totalFailureCount(), 1, 'COMMA')}|,
         'activity')}"></div>
    <div th:replace="~{admin/fragments/admin-ui :: statCard('오늘 추정 비용',
         '$' + ${#numbers.formatDecimal(todaySummary.totalEstimatedCostUsd(), 1, 'COMMA', 4, 'POINT')},
         |입력 ${#numbers.formatInteger(todaySummary.totalInputTokens(), 1, 'COMMA')} · 출력 ${#numbers.formatInteger(todaySummary.totalOutputTokens(), 1, 'COMMA')} 토큰|,
         'circle-dollar-sign')}"></div>
    <div th:replace="~{admin/fragments/admin-ui :: statCard('이번 달 호출',
         ${#numbers.formatInteger(monthSummary.totalCallCount(), 1, 'COMMA')},
         |성공 ${#numbers.formatInteger(monthSummary.totalSuccessCount(), 1, 'COMMA')} · 실패 ${#numbers.formatInteger(monthSummary.totalFailureCount(), 1, 'COMMA')}|,
         'calendar-days')}"></div>
    <div th:replace="~{admin/fragments/admin-ui :: statCard('이번 달 추정 비용',
         '$' + ${#numbers.formatDecimal(monthSummary.totalEstimatedCostUsd(), 1, 'COMMA', 4, 'POINT')},
         |입력 ${#numbers.formatInteger(monthSummary.totalInputTokens(), 1, 'COMMA')} · 출력 ${#numbers.formatInteger(monthSummary.totalOutputTokens(), 1, 'COMMA')} 토큰|,
         'wallet')}"></div>
  </div>

  <section class="card border border-base-300 bg-base-100">
    <div class="card-body gap-4 p-0 pb-4">
      <!--/* 필터: 주소의 callType·result 로 남아 쪽을 넘겨도 유지 */-->
      <form method="get" th:action="@{/admin/ai-calls}" class="flex flex-wrap items-end gap-2 px-4 pt-4">
        <label class="flex flex-col gap-1">
          <span class="text-xs text-base-content/60">종류</span>
          <select name="callType" class="select select-sm w-36">
            <option value="">전체</option>
            <option th:each="callType : ${callTypes}" th:value="${callType.name()}" th:text="${callType.label}"
                    th:selected="${callType == selectedCallType}">종류</option>
          </select>
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-xs text-base-content/60">결과</span>
          <select name="result" class="select select-sm w-32">
            <option value="">전체</option>
            <option value="success" th:selected="${selectedResult == 'success'}">성공</option>
            <option value="failure" th:selected="${selectedResult == 'failure'}">실패</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">보기</button>
        <a class="btn btn-ghost btn-sm" th:href="@{/admin/ai-calls}">필터 지우기</a>
      </form>

      <div class="overflow-x-auto">
        <table class="table table-sm admin-stack-table">
          <thead>
          <tr>
            <th>시각</th>
            <th>종류</th>
            <th>제공자</th>
            <th>모델</th>
            <th>키 별명</th>
            <th>결과</th>
            <th class="text-right">걸린 시간</th>
            <th class="text-right">입력 토큰</th>
            <th class="text-right">출력 토큰</th>
            <th class="text-right">추정 비용</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="callRow : ${callRows}">
            <td class="admin-stack-primary admin-number whitespace-nowrap" th:text="${@adminDateTimeFormatter.format(callRow.createdAt)}">-</td>
            <td class="whitespace-nowrap" th:text="${callRow.callTypeLabel}" data-label="종류">종류</td>
            <td th:text="${callRow.provider}" data-label="제공자">anthropic</td>
            <td class="whitespace-nowrap text-sm text-base-content/70" th:text="${callRow.model} ?: '-'" data-label="모델">모델</td>
            <td th:text="${callRow.keyLabel} ?: '-'" data-label="키 별명">별명</td>
            <td data-label="결과">
              <span th:replace="~{admin/fragments/admin-ui :: toneBadge(${callRow.isSuccess()} ? 'success' : 'error', ${callRow.isSuccess()} ? '성공' : (${callRow.failureLabel} ?: '실패'))}"></span>
            </td>
            <td class="admin-number whitespace-nowrap text-right"
                th:text="${callRow.latencyMilliseconds == null} ? '-' : |${#numbers.formatInteger(callRow.latencyMilliseconds, 1, 'COMMA')}ms|" data-label="걸린 시간">-</td>
            <td class="admin-number text-right"
                th:text="${callRow.inputTokens == null} ? '-' : ${#numbers.formatInteger(callRow.inputTokens, 1, 'COMMA')}" data-label="입력 토큰">-</td>
            <td class="admin-number text-right"
                th:text="${callRow.outputTokens == null} ? '-' : ${#numbers.formatInteger(callRow.outputTokens, 1, 'COMMA')}" data-label="출력 토큰">-</td>
            <td class="admin-number whitespace-nowrap text-right"
                th:text="${callRow.estimatedCostUsd == null} ? '-' : ('$' + ${callRow.estimatedCostUsd.toPlainString()})" data-label="추정 비용">-</td>
          </tr>
          <th:block th:if="${#lists.isEmpty(callRows)}">
            <tr th:replace="~{admin/fragments/admin-ui :: emptyRow(10, '아직 남은 호출 기록이 없어요')}"></tr>
          </th:block>
          </tbody>
        </table>
      </div>
      <div class="px-4">
        <nav th:replace="~{admin/fragments/admin-ui :: pagination(${pagination}, ${paginationBasePath})}"></nav>
      </div>
    </div>
  </section>
</main>

</body>
</html>
