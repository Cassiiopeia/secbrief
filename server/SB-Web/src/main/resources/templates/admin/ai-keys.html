<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('AI 키', 'ai-keys', ~{::content})}">
<body>

<main th:fragment="content" class="flex-1 space-y-6 p-4 lg:p-6">
  <div th:replace="~{admin/fragments/admin-ui :: pageHeader('AI 키',
       '제공자마다 키를 등록하고, 제공자 순서를 정해요. 위에 있는 키부터 쓰고 키에 문제가 생기면 다음 키로 넘어가요. 키 값은 암호화해 저장하고 화면에는 끝 4자만 보여 줘요.')}"></div>

  <div role="alert" class="alert alert-warning" th:if="${!canStoreSecret}">
    <i data-lucide="triangle-alert" class="size-5"></i>
    <span>암호화 마스터 키가 없어 키를 추가하거나 바꿀 수 없어요. 운영 설정에 <code>secbrief.secret.master-key</code> 를 넣고 서버를 다시 띄워 주세요. (SECRET_MASTER_KEY_MISSING)</span>
  </div>

  <!--/* 제공자 우선순위 */-->
  <section class="card border border-base-300 bg-base-100">
    <div class="card-body gap-4">
      <div th:replace="~{admin/fragments/admin-ui :: cardHeader('AI 제공자 우선순위',
           '1순위 제공자부터 부르고, 호출이 실패하면 다음 순위로 넘어가요. 준비가 안 된 제공자는 건너뛰어요.')}"></div>
      <div class="flex flex-wrap gap-2">
        <div class="flex items-center gap-2 rounded-box border border-base-300 px-3 py-2" th:each="providerView : ${providerViews}">
          <span class="font-medium" th:text="${providerView.providerCode}">anthropic</span>
          <span th:replace="~{admin/fragments/admin-ui :: toneBadge(${providerView.isInPriority()} ? 'info' : 'ghost', ${providerView.isInPriority()} ? |${providerView.priority}순위| : '안 씀')}"></span>
          <span th:replace="~{admin/fragments/admin-ui :: toneBadge(${providerView.isAvailable()} ? 'success' : 'warning', ${providerView.isAvailable()} ? '준비됨' : '키·주소 없음')}"></span>
        </div>
      </div>
      <form method="post" th:action="@{/admin/ai-keys/provider-priority}" class="flex flex-wrap items-end gap-2">
        <!--/* 순위 칸은 아는 제공자 수만큼. 같은 제공자를 두 번 고르면 앞의 것만 씀 */-->
        <label class="flex flex-col gap-1" th:each="providerView, slot : ${providerViews}">
          <span class="text-xs text-base-content/60" th:text="|${slot.count}순위|">1순위</span>
          <select name="providerCodes" class="select select-sm w-40" th:required="${slot.first}">
            <option value="" th:if="${!slot.first}">없음</option>
            <option th:each="candidateView : ${providerViews}" th:value="${candidateView.providerCode}"
                    th:text="${candidateView.providerCode}"
                    th:selected="${slot.index < #lists.size(priorityCodes) and priorityCodes[slot.index] == candidateView.providerCode}">제공자</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary btn-sm">우선순위 저장</button>
      </form>
    </div>
  </section>

  <!--/* 제공자별 키 구역: 같은 조각을 제공자 수만큼 */-->
  <th:block th:each="providerSection : ${providerSections}">
    <section th:replace="~{admin/fragments/ai-key-provider :: providerKeySection(${providerSection})}"></section>
  </th:block>
</main>

</body>
</html>
