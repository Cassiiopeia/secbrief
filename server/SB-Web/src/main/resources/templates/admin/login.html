<!DOCTYPE html>
<!-- 로그인 화면: 사이드바가 없어 틀(page)을 쓰지 않고 <head> 조각만 같이 씀 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
  <th:block th:replace="~{admin/fragments/admin-head :: assets('로그인')}"></th:block>
</head>
<body class="flex min-h-screen items-center justify-center bg-base-200 p-4 text-base-content">
<main class="card w-full max-w-sm border border-base-300 bg-base-100 shadow-sm">
  <div class="card-body gap-4">
    <div class="flex flex-col items-center gap-2 pb-2">
      <i data-lucide="shield-check" class="size-10 text-primary"></i>
      <h1 class="text-xl font-bold">시큐브리프 관리자</h1>
      <p class="text-sm text-base-content/60">관리자 계정으로 로그인해 주세요</p>
    </div>

    <div th:if="${param.error}" class="alert alert-error py-2 text-sm" role="alert">
      <i data-lucide="circle-alert" class="size-4"></i>
      <span>아이디나 비밀번호가 맞지 않아요 (ADMIN_LOGIN_FAILED)</span>
    </div>
    <div th:if="${param.locked}" class="alert alert-warning py-2 text-sm" role="alert">
      <i data-lucide="lock" class="size-4"></i>
      <span>여러 번 틀려서 잠시 잠갔어요. 15분쯤 뒤에 다시 해 주세요 (ADMIN_LOGIN_LOCKED)</span>
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 text-sm" role="status">
      <i data-lucide="circle-check" class="size-4"></i>
      <span>로그아웃했어요</span>
    </div>

    <form th:action="@{/admin/login}" method="post" class="flex flex-col gap-3">
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium">아이디</span>
        <input type="text" name="username" class="input w-full" autocomplete="username" maxlength="50"
               autocapitalize="none" spellcheck="false" required autofocus/>
      </label>
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium">비밀번호</span>
        <input type="password" name="password" class="input w-full" autocomplete="current-password" required/>
      </label>
      <button type="submit" class="btn btn-primary mt-2 w-full">로그인</button>
    </form>

    <div class="flex justify-center">
      <button type="button" class="btn btn-ghost btn-xs gap-1" data-theme-toggle>
        <i data-lucide="moon" class="size-4" data-theme-icon="light"></i>
        <i data-lucide="sun" class="size-4" data-theme-icon="dark" hidden></i>
        <span>밝게·어둡게 바꾸기</span>
      </button>
    </div>
  </div>
</main>
</body>
</html>
