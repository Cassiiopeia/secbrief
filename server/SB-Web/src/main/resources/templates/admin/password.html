<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/fragments/admin-layout :: page('비밀번호 변경', 'password', ~{::content})}">
<body>

<main th:fragment="content" class="flex-1 space-y-6 p-4 lg:p-6">
  <div th:replace="~{admin/fragments/admin-ui :: pageHeader('비밀번호 변경',
       '지금 로그인한 계정의 비밀번호를 바꿔요. 바꾼 사실은 관리자 기록에 남아요.')}"></div>

  <section class="card max-w-md border border-base-300 bg-base-100">
    <form th:action="@{/admin/password}" method="post" class="card-body gap-4" autocomplete="off"
          data-confirm-title="비밀번호를 바꿀까요?" data-confirm-label="바꾸기"
          data-confirm-message="다음 로그인부터 새 비밀번호를 써요.">
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium">현재 비밀번호</span>
        <input type="password" name="currentPassword" class="input w-full" autocomplete="current-password" required/>
      </label>
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium">새 비밀번호</span>
        <input type="password" name="newPassword" class="input w-full" autocomplete="new-password" required
               th:attr="minlength=${minimumPasswordLength}"/>
        <span class="text-xs text-base-content/60"
              th:text="|${minimumPasswordLength}자 이상으로, 영문과 숫자를 함께 써 주세요|">10자 이상</span>
      </label>
      <label class="flex flex-col gap-1">
        <span class="text-sm font-medium">새 비밀번호 확인</span>
        <input type="password" name="newPasswordConfirm" class="input w-full" autocomplete="new-password" required
               th:attr="minlength=${minimumPasswordLength}"/>
      </label>
      <div class="card-actions justify-end">
        <button type="submit" class="btn btn-primary">비밀번호 바꾸기</button>
      </div>
    </form>
  </section>
</main>

</body>
</html>
