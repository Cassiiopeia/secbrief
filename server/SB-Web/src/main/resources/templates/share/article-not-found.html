*/-->
<head>
  <th:block th:replace="~{share/fragments/share-page :: assets}"></th:block>
  <title>소식을 찾지 못했어요 · 시큐브리프</title>

<body>

  <section class="card">

  <th:block th:replace="~{share/fragments/share-page :: appActions(${links.appHomeUrl}, ${links.androidHomeIntentUrl})}"></th:block>
